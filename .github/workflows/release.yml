name: Release

# A release is a semver tag (vX.Y.Z). This builds the package + cuts a GitHub
# release with the artifacts attached. Consumers install from the tag
# (pip install "git+https://github.com/sulis-ai/workflows.git@vX.Y.Z").
# PyPI publish can be added here later (a publish step gated on the tag).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2.0.8
        with:
          generate_release_notes: true
          files: dist/*
