name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-python@v5.1.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Lint (ruff check)
        run: python -m ruff check src/sulis_workflows/definition/ tests/definition/
      - name: Format (ruff format --check)
        run: python -m ruff format --check src/sulis_workflows/definition/ tests/definition/
      - name: Type check (mypy)
        run: python -m mypy src/sulis_workflows/definition/
