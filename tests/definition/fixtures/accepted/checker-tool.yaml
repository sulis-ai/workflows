# spec §5.2 example, verbatim — a checker is a CODE Tool with a passing and a failing example.
api_version: sulis.workflows/v1
kind: TOOL
id: profile-conformance
version: 1.0.0
title: Profile conformance checker
mechanism: { kind: CODE, ref: "sulis_workflows.checkers:profile_conformance" }
checker_for: { control: PROFILE }
inputs:
  value:   { type: any }
  control: { type: string }
output:
  result: { type: "profile:control-result@1" }
controls: [ { profile: control-result@1 } ]
effect: QUERY
examples:
  - { name: "conforming finding passes", inputs: { value: { id: "f1", claim: "the sky is blue enough", source: "obs" }, control: "finding@1" }, expect: { result: { passed: true } } }
  - { name: "finding without a source fails", inputs: { value: { id: "f1", claim: "the sky is blue enough" }, control: "finding@1" }, expect: { result: { passed: false } } }
