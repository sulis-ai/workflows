# V1 casing/closed-value: `op` must be one of the closed GTE|GT|LTE|LT|EQ set (spec
# §5.1 D8). Bad-but-conformant: ">=" reads as the same comparison to a person, but
# it is not a member of the declared enum.
api_version: sulis.workflows/v1
kind: CONTROL
id: coverage-floor
version: 1.0.0
type: FITNESS
title: Insight coverage stays above the floor
applies_to: output.insights
checker: coverage-ratio@1
severity: ERROR
threshold: { metric: coverage_ratio, op: ">=", value: 0.8 }
