[project]
name = "sulis-workflows"
version = "0.12.1"
description = "The Sulis workflow engine — a shared, published library. Compiles canonical Workflow entities to a LangGraph graph and executes it under injected adapters; the same library runs server-side or client-side (per DR-040)."
authors = [{ name = "Sulis AI", email = "iain@llma.ai" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph >= 0.2",
    "pydantic >= 2.0",
    "networkx >= 3.0",        # compiler: DAG validation / cycle detection
    "pyyaml >= 6.0",          # kind/spec YAML parsing
    "prometheus-client >= 0.20",  # compiler metrics
    "jsonschema >= 4.18",     # definition/: validates documents against the v1 format's
                               # JSON Schema 2020-12 meta-schemas, and Profile.schema is
                               # itself arbitrary JSON Schema 2020-12 — a general-purpose
                               # standard implementation, the same class of dependency as
                               # pydantic already is elsewhere in domain/ (not a vendor SDK;
                               # see docs/runs/ for this WP-01 PR's decision record).
]
# NOTE: the engine intentionally does NOT depend on an LLM SDK (e.g. anthropic).
# LLM access is the injected LLMPort's job; a content node's call-time `import anthropic`
# is a deferred coupling to be routed through the port (see compiler/nodes/content_node.py).

[project.optional-dependencies]
dev = [
    "pytest >= 8.0",
    "pytest-cov >= 5.0",
    "ruff >= 0.15",
    "mypy >= 1.19",
    "types-PyYAML",     # yaml ships no inline types
    "types-jsonschema", # jsonschema ships no inline types (checked: no py.typed marker)
]

[project.scripts]
sulis-workflows = "sulis_workflows.definition.cli:main"

[project.urls]
Homepage = "https://github.com/sulis-ai/workflows"

[build-system]
requires = ["setuptools >= 65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

# WP-01 step 5: ruff/mypy are scoped to src/sulis_workflows/definition/ in CI
# (.github/workflows/ci.yml) — that is this work package's own surface, not the
# rest of the repository (compiler/ is a separate, deprecated path CLAUDE.md
# says not to touch). These [tool.*] sections hold settings, not that scoping;
# the scoping lives in the CI invocation itself so a bare `ruff check .` run
# locally still covers the whole repo rather than silently narrowing it.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
